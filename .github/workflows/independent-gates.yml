name: Independent Quality Gates

on:
  push:
    branches:
      - feature/test-security-gate
  pull_request:
    branches:
      - feature/test-security-gate

jobs:
  gate1-code-quality:
    name: Gate 1 - Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CI Tools
        run: |
          python -m pip install --upgrade pip
          pip install black pylint

      - name: Run Black
        run: black --check .

      - name: Run Pylint
        run: pylint student.py database.py app.py

  gate2-test-coverage:
    name: Gate 2 - Test Coverage
    needs: gate1-code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Tests with Coverage
        run: |
          export PYTHONPATH=$PWD
          pytest --cov=. --cov-fail-under=60

  gate3-security:
    name: Gate 3 - Security
    needs: gate2-test-coverage
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  email-notification:
    name: Email Notification
    needs: gate3-security
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Security Quality Gate Failed"
          body: |
            Hello Hari Charan,

            The Independent Quality Gates workflow has completed.

            Gate 1 - Code Quality: PASSED
            Gate 2 - Test Coverage: PASSED
            Gate 3 - Security: FAILED

            Please review the GitHub Actions logs.

            Regards,
            GitHub Actions
          to: haricharanadepu1@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}